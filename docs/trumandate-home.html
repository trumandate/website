<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      TruMandate — Portfolio governance for the office that sets direction
    </title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #04241e;
        --jade: #0b4a3d;
        --jade-lift: #0f5c4b;
        --accent: #19c39b;
        --amber: #f2b441;
        --red: #e0574c;
        --paper: #f1f5f3;
        --muted: #9cb8ae;
        --line: rgba(255, 255, 255, 0.1);
        --sans:
          "IBM Plex Sans Arabic", -apple-system, "Segoe UI", Tahoma, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --lh: 1.55;
        --pad: clamp(20px, 5vw, 72px);
        --maxw: 1180px;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      html[lang="ar"] {
        --lh: 1.85;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        font-weight: 300;
        line-height: var(--lh);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3,
      p,
      ul {
        margin: 0;
      }
      ul {
        padding: 0;
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      /* ---------- shared type roles ---------- */
      .eyebrow {
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      html[lang="ar"] .eyebrow {
        letter-spacing: 0;
        font-family: var(--sans);
        font-weight: 600;
        font-size: 0.78rem;
      }
      .display {
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.08;
        font-size: clamp(2.1rem, 5.4vw, 4.15rem);
      }
      html[lang="ar"] .display {
        letter-spacing: 0;
        line-height: 1.3;
      }
      .h2 {
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.14;
        font-size: clamp(1.7rem, 3.6vw, 2.85rem);
      }
      html[lang="ar"] .h2 {
        letter-spacing: 0;
        line-height: 1.4;
      }
      .lede {
        font-size: clamp(1.02rem, 1.5vw, 1.24rem);
        color: #cfe0da;
        max-width: 56ch;
      }
      .small {
        font-size: 0.94rem;
        color: var(--muted);
        max-width: 52ch;
      }
      .datum {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      html[lang="ar"] .datum {
        font-family: var(--sans);
        letter-spacing: 0;
        text-transform: none;
        font-size: 0.82rem;
      }

      .wrap {
        max-width: var(--maxw);
        margin-inline: auto;
        padding-inline: var(--pad);
      }
      section {
        position: relative;
        padding-block: clamp(72px, 11vh, 132px);
      }

      /* ---------- scroll progress ---------- */
      .prog {
        position: fixed;
        inset-block-start: 0;
        inset-inline: 0;
        height: 2px;
        background: transparent;
        z-index: 60;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--accent);
        transform-origin: left center;
        transform: scaleX(var(--sp, 0));
      }
      html[dir="rtl"] .prog i {
        transform-origin: right center;
      }

      /* ---------- nav ---------- */
      header {
        position: fixed;
        inset-block-start: 0;
        inset-inline: 0;
        z-index: 50;
        backdrop-filter: blur(14px);
        background: rgba(4, 36, 30, 0.72);
        border-block-end: 1px solid transparent;
        transition:
          border-color 0.3s,
          background 0.3s;
      }
      header.stuck {
        border-block-end-color: var(--line);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: clamp(14px, 3vw, 34px);
        height: 66px;
      }
      .brand {
        font-weight: 600;
        letter-spacing: -0.01em;
        font-size: 1.06rem;
      }
      .brand span {
        color: var(--accent);
      }
      .nav ul {
        display: flex;
        gap: clamp(12px, 2.4vw, 26px);
        margin-inline-start: auto;
        font-size: 0.9rem;
        color: #c6dad3;
      }
      .nav ul a:hover {
        color: var(--accent);
      }
      .langbtn {
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        border: 1px solid var(--line);
        background: none;
        color: var(--paper);
        padding: 7px 12px;
        border-radius: 2px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .langbtn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      @media (max-width: 720px) {
        .nav ul {
          display: none;
        }
      }

      /* ---------- reveal ---------- */
      .rise {
        opacity: 0;
        transform: translateY(26px);
        transition:
          opacity 0.8s var(--ease),
          transform 0.8s var(--ease);
      }
      .rise.in {
        opacity: 1;
        transform: none;
      }
      .rise.d1 {
        transition-delay: 0.08s;
      }
      .rise.d2 {
        transition-delay: 0.16s;
      }
      .rise.d3 {
        transition-delay: 0.24s;
      }

      /* ---------- hero ---------- */
      .hero {
        min-height: 100svh;
        display: flex;
        align-items: center;
        padding-block-start: 120px;
        overflow: hidden;
      }
      .hero .wrap {
        width: 100%;
      }
      .hero .display {
        max-width: 20ch;
        margin-block: 22px 26px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: clamp(28px, 6vw, 72px);
        align-items: center;
      }
      @media (max-width: 900px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-block-start: 34px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 13px 22px;
        border-radius: 2px;
        font-size: 0.94rem;
        font-weight: 500;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #04241e;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .btn:hover {
        background: #22ddb0;
      }
      .btn.ghost {
        background: none;
        color: var(--paper);
        border-color: var(--line);
      }
      .btn.ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* hero card: origin of the chain */
      .origin {
        border: 1px solid var(--line);
        background: linear-gradient(160deg, var(--jade), #083a30);
        padding: 22px;
        border-radius: 3px;
        position: relative;
      }
      .origin .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-block: 12px;
        border-block-start: 1px solid var(--line);
      }
      .origin .row:first-of-type {
        border-block-start: 0;
      }
      .origin .val {
        font-family: var(--mono);
        font-size: 1.02rem;
        font-weight: 500;
      }
      .rag {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: 0 0 auto;
        display: inline-block;
      }
      .rag.g {
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(25, 195, 155, 0.55);
        animation: pulse 2.8s infinite;
      }
      .rag.a {
        background: var(--amber);
      }
      .rag.r {
        background: var(--red);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(25, 195, 155, 0.5);
        }
        70% {
          box-shadow: 0 0 0 11px rgba(25, 195, 155, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(25, 195, 155, 0);
        }
      }
      .spark {
        width: 100%;
        height: 38px;
        display: block;
        margin-block-start: 6px;
      }
      .spark path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.6;
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        transition: stroke-dashoffset 1.6s var(--ease) 0.3s;
      }
      .in .spark path,
      .origin.in .spark path {
        stroke-dashoffset: 0;
      }

      /* ---------- gap section ---------- */
      .gap-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(18px, 3vw, 34px);
        margin-block-start: 46px;
      }
      @media (max-width: 860px) {
        .gap-grid {
          grid-template-columns: 1fr;
        }
      }
      .gap-item {
        padding-block-start: 18px;
        border-block-start: 1px solid var(--line);
      }
      .gap-item p {
        margin-block-start: 10px;
        font-size: 1rem;
        color: #c6dad3;
      }

      /* ---------- signature: the chain ---------- */
      .chain {
        background: var(--jade);
      }
      .chain-head {
        max-width: 46ch;
        margin-block-end: clamp(34px, 6vw, 66px);
      }
      .chain-rail {
        position: relative;
        padding-inline-start: 54px;
      }
      html[dir="rtl"] .chain-rail {
        padding-inline-start: 54px;
      }
      .rail {
        position: absolute;
        inset-block: 6px 6px;
        inset-inline-start: 15px;
        width: 1px;
        background: var(--line);
      }
      .rail i {
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 0;
        width: 100%;
        height: calc(var(--cp, 0) * 100%);
        background: linear-gradient(180deg, var(--accent), #8fe9d4);
        display: block;
      }
      .link {
        position: relative;
        padding-block: clamp(20px, 3.4vw, 34px);
      }
      .link::before {
        content: "";
        position: absolute;
        inset-inline-start: -46px;
        inset-block-start: calc(clamp(20px, 3.4vw, 34px) + 8px);
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--jade);
        border: 1px solid var(--muted);
        transition:
          border-color 0.45s,
          background 0.45s,
          box-shadow 0.45s;
      }
      .link.on::before {
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 0 5px rgba(25, 195, 155, 0.16);
      }
      .link h3 {
        font-size: clamp(1.22rem, 2.3vw, 1.7rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        opacity: 0.45;
        transition: opacity 0.45s;
      }
      .link.on h3 {
        opacity: 1;
      }
      .link p {
        margin-block-start: 8px;
        color: #b9d2ca;
        font-size: 1rem;
        max-width: 52ch;
        opacity: 0.4;
        transition: opacity 0.5s;
      }
      .link.on p {
        opacity: 1;
      }
      .link .tag {
        margin-block-start: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      /* ---------- product screen ---------- */
      .screen-grid {
        display: grid;
        grid-template-columns: 1.4fr 0.6fr;
        gap: clamp(24px, 4vw, 52px);
        align-items: start;
        margin-block-start: 44px;
      }
      @media (max-width: 960px) {
        .screen-grid {
          grid-template-columns: 1fr;
        }
      }
      .frame {
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
        background: #021813;
        box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.75);
      }
      .frame svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .callouts li {
        display: flex;
        gap: 13px;
        padding-block: 14px;
        border-block-start: 1px solid var(--line);
        opacity: 0;
        transform: translateY(14px);
        transition:
          opacity 0.6s var(--ease),
          transform 0.6s var(--ease);
      }
      .callouts.in li {
        opacity: 1;
        transform: none;
      }
      .callouts.in li:nth-child(2) {
        transition-delay: 0.1s;
      }
      .callouts.in li:nth-child(3) {
        transition-delay: 0.2s;
      }
      .callouts.in li:nth-child(4) {
        transition-delay: 0.3s;
      }
      .dotnum {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.7rem;
        display: grid;
        place-items: center;
        margin-block-start: 2px;
      }
      .callouts p {
        font-size: 0.95rem;
        color: #c6dad3;
      }

      /* ---------- AI ---------- */
      .ai-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(24px, 5vw, 64px);
        align-items: center;
      }
      @media (max-width: 900px) {
        .ai-grid {
          grid-template-columns: 1fr;
        }
      }
      .ai-card {
        border: 1px solid var(--line);
        background: linear-gradient(160deg, #0a4438, #062b23);
        border-radius: 3px;
        padding: 22px;
      }
      .ai-card .hd {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
      }
      .badge {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 4px 8px;
        border-radius: 2px;
      }
      html[lang="ar"] .badge {
        font-family: var(--sans);
        letter-spacing: 0;
        font-size: 0.74rem;
      }
      .ai-card .big {
        font-size: 1.5rem;
        font-weight: 600;
        margin-block: 14px 4px;
      }
      .acts {
        display: flex;
        gap: 9px;
        margin-block-start: 18px;
        flex-wrap: wrap;
      }
      .acts button {
        font-family: inherit;
        font-size: 0.86rem;
        padding: 9px 15px;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: none;
        color: var(--paper);
        transition:
          0.2s border-color,
          0.2s color;
      }
      .acts button:first-child {
        border-color: var(--accent);
        color: var(--accent);
      }
      .acts button:hover {
        border-color: var(--paper);
      }
      .logline {
        margin-block-start: 14px;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
      }
      html[lang="ar"] .logline {
        font-family: var(--sans);
        font-size: 0.82rem;
      }

      /* ---------- alignment chips ---------- */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-block-start: 30px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 100px;
        padding: 9px 16px;
        font-size: 0.9rem;
        color: #cfe0da;
      }
      .chip b {
        color: var(--accent);
        font-weight: 500;
      }

      /* ---------- modules ---------- */
      .mods {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(14px, 2vw, 26px);
        margin-block-start: 40px;
      }
      @media (max-width: 900px) {
        .mods {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 520px) {
        .mods {
          grid-template-columns: 1fr;
        }
      }
      .mod {
        border-block-start: 1px solid var(--line);
        padding-block-start: 16px;
      }
      .mod h4 {
        margin: 0 0 12px;
        font-size: 0.72rem;
        font-family: var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 500;
      }
      html[lang="ar"] .mod h4 {
        font-family: var(--sans);
        letter-spacing: 0;
        font-size: 0.84rem;
      }
      .mod li {
        font-size: 0.96rem;
        color: #c6dad3;
        padding-block: 5px;
      }

      /* ---------- form ---------- */
      .contact {
        background: var(--jade);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-block-start: 32px;
        max-width: 720px;
      }
      @media (max-width: 620px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      label {
        font-size: 0.82rem;
        color: var(--muted);
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 0.98rem;
        color: var(--paper);
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 12px 13px;
        transition: border-color 0.2s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        outline: none;
      }
      textarea {
        min-height: 104px;
        resize: vertical;
      }
      select option {
        background: var(--ink);
      }
      .hp {
        position: absolute;
        inset-inline-start: -9999px;
      }
      .formnote {
        margin-block-start: 14px;
        font-size: 0.84rem;
        color: var(--muted);
      }

      footer {
        border-block-start: 1px solid var(--line);
        padding-block: 30px;
        font-size: 0.86rem;
        color: var(--muted);
      }
      .foot {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: space-between;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .rise {
          opacity: 1;
          transform: none;
          transition: none;
        }
        .callouts li {
          opacity: 1;
          transform: none;
          transition: none;
        }
        .spark path {
          stroke-dashoffset: 0;
          transition: none;
        }
        .link h3,
        .link p {
          opacity: 1;
        }
        .link::before {
          background: var(--accent);
          border-color: var(--accent);
        }
        .rag.g {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="prog"><i></i></div>

    <header id="hdr">
      <div class="wrap nav">
        <a class="brand" href="#top">Tru<span>Mandate</span></a>
        <ul>
          <li><a href="#chain" data-i18n="nav.trace"></a></li>
          <li><a href="#screen" data-i18n="nav.platform"></a></li>
          <li><a href="#ai" data-i18n="nav.ai"></a></li>
          <li><a href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
        <button class="langbtn" id="lang">العربية</button>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero" id="top">
      <div class="wrap">
        <div class="hero-grid">
          <div>
            <p class="eyebrow rise" data-i18n="hero.eyebrow"></p>
            <h1 class="display rise d1" data-i18n="hero.h1"></h1>
            <p class="lede rise d2" data-i18n="hero.lede"></p>
            <div class="cta-row rise d3">
              <a class="btn" href="#contact" data-i18n="cta.demo"></a>
              <a class="btn ghost" href="#chain" data-i18n="cta.see"></a>
            </div>
          </div>
          <div class="origin rise d2" id="origin">
            <p class="datum" data-i18n="origin.label"></p>
            <div class="row">
              <span data-i18n="origin.obj"></span>
              <span class="val">v3</span>
            </div>
            <div class="row">
              <span data-i18n="origin.kpi"></span>
              <span class="val">68 / 75 <span class="rag g"></span></span>
            </div>
            <div class="row">
              <span data-i18n="origin.init"></span>
              <span class="val">14 <span class="rag a"></span></span>
            </div>
            <div class="row">
              <span data-i18n="origin.ben"></span>
              <span class="val">AED 41M</span>
            </div>
            <svg
              class="spark"
              viewBox="0 0 260 38"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <path
                d="M0,30 L26,27 L52,29 L78,22 L104,24 L130,17 L156,19 L182,12 L208,14 L234,7 L260,5"
              />
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- THE GAP -->
    <section>
      <div class="wrap">
        <p class="eyebrow rise" data-i18n="gap.eyebrow"></p>
        <h2
          class="h2 rise d1"
          style="max-width: 24ch; margin-block-start: 16px"
          data-i18n="gap.h2"
        ></h2>
        <div class="gap-grid">
          <div class="gap-item rise">

      let lang = 0; // 0 = en, 1 = ar
      const paint = () => {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const v = T[el.dataset.i18n];
          if (v) el.textContent = v[lang];
        });
        const html = document.documentElement;
        html.lang = lang ? "ar" : "en";
        html.dir = lang ? "rtl" : "ltr";
        document.getElementById("lang").textContent = lang
          ? "English"
          : "العربية";
      };
      document.getElementById("lang").addEventListener("click", () => {
        lang = lang ? 0 : 1;
        paint();
      });
      paint();

      /* reveal on enter */
      const io = new IntersectionObserver(
        (es) => {
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          });
        },
        { rootMargin: "0px 0px -12% 0px", threshold: 0.15 },
      );
      document
        .querySelectorAll(".rise,.callouts")
        .forEach((el) => io.observe(el));

      /* single rAF loop: page progress + chain rail */
      const rail = document.getElementById("rail");
      const links = [...document.querySelectorAll(".link")];
      const bar = document.querySelector(".prog");
      let queued = false;
      const frame = () => {
        queued = false;
        const doc = document.documentElement;
        const sp =
          doc.scrollTop / Math.max(1, doc.scrollHeight - doc.clientHeight);
        bar.style.setProperty("--sp", sp.toFixed(4));

        const r = rail.getBoundingClientRect();
        const vh = window.innerHeight;
        const span = r.height + vh * 0.5;
        let p = (vh * 0.75 - r.top) / span;
        p = Math.min(1, Math.max(0, p));
        rail.querySelector(".rail").style.setProperty("--cp", p.toFixed(4));
        links.forEach((l, i) => {
          const hit = l.getBoundingClientRect().top < vh * 0.78;
          l.classList.toggle("on", hit);
        });
      };
      addEventListener(
        "scroll",
        () => {
          if (!queued) {
            queued = true;
            requestAnimationFrame(frame);
          }
        },
        { passive: true },
      );
      addEventListener("resize", frame);
      frame();

      /* nav border once moved */
      const hdr = document.getElementById("hdr");
      addEventListener(
        "scroll",
        () => hdr.classList.toggle("stuck", scrollY > 12),
        { passive: true },
      );
    </script>
