<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/trumandate-website-ds-f4b70156-88a9-4176-bb0f-9afd57cdfe2e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/trumandate-website-ds-f4b70156-88a9-4176-bb0f-9afd57cdfe2e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/trumandate-website-ds-f4b70156-88a9-4176-bb0f-9afd57cdfe2e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/trumandate-website-ds-f4b70156-88a9-4176-bb0f-9afd57cdfe2e/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/trumandate-website-ds-f4b70156-88a9-4176-bb0f-9afd57cdfe2e/_ds_bundle.css">
  <style>
    body { margin: 0; background: #04241E; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; font-weight: 300; color: #C6DAD3; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: #19C39B; }
    svg { display: block; max-width: 100%; }
    @keyframes tm-enter { to { opacity: 1; transform: translateY(0); } }
    .tm-load { opacity: 0; transform: translateY(26px); animation: tm-enter 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; animation-delay: var(--d, 0ms); }
    @media (prefers-reduced-motion: reduce) { .tm-load { opacity: 1; transform: none; animation: none; } }
  </style>
</helmet>
<div style="width: 100%; overflow-x: clip;">
  <dc-import name="SiteHeader" hint-size="100%,95px"></dc-import>

  <section data-screen-label="Contact hero" class="relative w-full" style="padding-top: clamp(3.5rem, 8vh, 6rem); padding-bottom: clamp(1.5rem, 3vh, 2.5rem);">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 z-0">
      <div class="absolute inset-0 bg-ground-rise"></div>
      <div class="absolute inset-0 bg-grid-draft" style="mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 80%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 80%, transparent 100%);"></div>
    </div>
    <div class="relative z-10 mx-auto max-w-content px-gutter">
      <p class="tm-load font-mono text-eyebrow font-data uppercase tracking-eyebrow" style="color: #4BEFC4;">Next step</p>
      <h1 class="tm-load mt-5 font-sans text-display font-semi tracking-display text-paper lg:tracking-display-lg" style="--d: 90ms; max-width: 18ch; text-wrap: balance;">See it against <span style="background: linear-gradient(92deg, #19C39B 0%, #59D8E6 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">your own plan</span>.</h1>
      <p class="tm-load mt-6 text-lede font-light text-body" style="--d: 180ms; max-width: 54ch;">Send this and we will run the demo on a portfolio shaped like yours, not a sample dataset.</p>
      <p class="tm-load mt-4 text-small font-light text-muted" style="--d: 260ms;">Prefer email? Write to <a href="mailto:trumandate@intertecsys.com" class="text-paper underline underline-offset-4">trumandate@intertecsys.com</a>.</p>
    </div>
  </section>

  <section data-screen-label="Form" class="relative w-full" style="padding-block: clamp(2rem, 4vh, 3rem) clamp(3rem, 6vh, 5rem);">
    <div class="relative z-10 mx-auto max-w-content px-gutter">
      <div class="tm-load" style="--d: 320ms; max-width: 760px; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; background: linear-gradient(180deg, #0C4237 0%, #0A3B31 100%); padding: clamp(22px, 4vw, 40px); box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.16), 0 14px 32px -10px rgba(2,24,19,0.6);">
        <form>
          <div class="grid grid-cols-1 gap-x-gutter gap-y-8 lg:grid-cols-2">
            <div>
              <label for="c-name" class="text-small font-semi text-paper">Name<span aria-hidden="true" class="text-muted"> *</span></label>
              <input id="c-name" type="text" autocomplete="name" class="mt-2 w-full border-0 border-b border-hairline bg-transparent py-3 text-body font-light text-paper" style="min-height: 44px; outline: none;">
            </div>
            <div>
              <label for="c-org" class="text-small font-semi text-paper">Organisation<span aria-hidden="true" class="text-muted"> *</span></label>
              <input id="c-org" type="text" autocomplete="organization" class="mt-2 w-full border-0 border-b border-hairline bg-transparent py-3 text-body font-light text-paper" style="min-height: 44px; outline: none;">
            </div>
            <div style="grid-column: 1 / -1;">
              <label for="c-email" class="text-small font-semi text-paper">Work email<span aria-hidden="true" class="text-muted"> *</span></label>
              <input id="c-email" type="email" autocomplete="email" class="mt-2 w-full border-0 border-b border-hairline bg-transparent py-3 text-body font-light text-paper" style="min-height: 44px; outline: none;">
            </div>
          </div>
          <fieldset class="mt-8 border-0 p-0" style="margin-inline: 0;">
            <legend class="text-small font-semi text-paper">What you want to see<span aria-hidden="true" class="text-muted"> *</span></legend>
            <div class="mt-3 flex flex-col gap-3">
              <label class="flex items-center gap-3 text-body font-light text-paper" style="min-height: 44px;"><input type="radio" name="c-interest" class="size-4 shrink-0" style="accent-color: #19C39B;">Full platform demo</label>
              <label class="flex items-center gap-3 text-body font-light text-paper" style="min-height: 44px;"><input type="radio" name="c-interest" class="size-4 shrink-0" style="accent-color: #19C39B;">Strategy and KPI cascade</label>
              <label class="flex items-center gap-3 text-body font-light text-paper" style="min-height: 44px;"><input type="radio" name="c-interest" class="size-4 shrink-0" style="accent-color: #19C39B;">Benefits realisation</label>
              <label class="flex items-center gap-3 text-body font-light text-paper" style="min-height: 44px;"><input type="radio" name="c-interest" class="size-4 shrink-0" style="accent-color: #19C39B;">Deployment and data sovereignty</label>
            </div>
          </fieldset>
          <div class="mt-8">
            <label for="c-msg" class="text-small font-semi text-paper">Anything we should know</label>
            <textarea id="c-msg" rows="4" class="mt-2 w-full resize-y border-0 border-b border-hairline bg-transparent py-3 text-body font-light text-paper" style="outline: none;"></textarea>
          </div>
          <div class="mt-10">
            <button type="button" class="inline-flex shrink-0 items-center justify-center whitespace-nowrap rounded-control bg-accent text-small font-semi text-ink" style="min-height: 46px; padding-inline: 24px; min-width: 12rem; border: 0; cursor: pointer; transition: background 150ms cubic-bezier(0.22, 1, 0.36, 1), color 150ms cubic-bezier(0.22, 1, 0.36, 1);" style-hover="background: transparent; color: #19C39B; outline: 1px solid #19C39B;">Book a demo</button>
            <p class="mt-4 font-mono text-datum font-data tracking-datum text-muted">We reply from a named address, not a queue.</p>
          </div>
        </form>
      </div>

    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
</body>
</html>
