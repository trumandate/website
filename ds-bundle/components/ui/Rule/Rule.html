<!-- @dsCard group="ui" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rule</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  body{margin:0;padding:24px;background:#04241E}
  .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start}
  .ds-cell{border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:24px 24px 28px;min-width:0}
  .ds-cell>h4{margin:0 0 24px;font:600 11px/1.2 system-ui;color:#9CB8AE;text-transform:uppercase;letter-spacing:.06em}
  /* Rule.astro's own scoped style, copied verbatim (the origin-flip only
     matters mid-animation; harmless at rest, shown here for completeness). */
  hr.rule{transform-origin:0% 50%}
  [dir="rtl"] hr.rule{transform-origin:100% 50%}
</style>
</head>
<body class="bg-ink">
  <div class="ds-grid">
    <section class="ds-cell">
      <h4>dashed=false (default) — solid hairline</h4>
      <hr class="rule m-0 border-0 border-t border-hairline border-solid" />
    </section>
    <section class="ds-cell">
      <h4>dashed=true — dashed hairline (used by FailureModes.astro, which draws it via a scaleX(0→1) tween)</h4>
      <hr class="rule m-0 border-0 border-t border-hairline border-dashed" />
    </section>
    <section class="ds-cell" dir="rtl">
      <h4>dashed=true — dir="rtl" (transform-origin flips to the inline-start edge so a draw animation still starts from the reading direction's own start)</h4>
      <hr class="rule m-0 border-0 border-t border-hairline border-dashed" />
    </section>
  </div>
</body>
</html>
