<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="TruMandate">
  <!-- The mark: the authoritative Echelons geometry (2026-08-19 user
       directive, BUILD_FLAGS.md decision log) — re-authored as inline SVG
       from the product's own EchelonsLogo.tsx, measured against the
       1173×1174 master. This SUPERSEDES the P9-era "optically corrected"
       favicon this file used to carry (thicker bars, tighter padding, a
       looser tile radius), which the brand doc explicitly forbids: the pill
       radius is what keeps the mark legible at 16px, not a hand-tuned
       reproportioning. This file, Header.astro/Footer.astro/
       CommandCentreBoard.astro's own inline marks, and public/og/*.png's
       lockup now all share one exact geometry — nothing to keep in sync by
       hand, and nothing optically diverges from the large lockup any more.

       Colours are the literal brand hexes (tailwind.config.mjs's
       brand-teal/brand-green/brand-tile tokens, spelled out here since this
       is a standalone SVG file, not an Astro component with class="fill-*"
       available) — deliberately not the site's jade/accent/paper tokens, and
       never restyled to them. -->
  <rect width="48" height="48" rx="8.87" fill="#F1F4F3"/>
  <rect x="11.15" y="12.79" width="25.59" height="4.77" rx="2.385" fill="#0E7E6D"/>
  <rect x="11.2" y="21.57" width="18.27" height="4.78" rx="2.39" fill="#21B586"/>
  <rect x="11.2" y="30.37" width="11.15" height="4.77" rx="2.385" fill="#21B586"/>
</svg>
